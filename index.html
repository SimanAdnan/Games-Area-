<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXIS GAME AREA | Premium Mods</title>
    <style>
        /* --- CORE VARIABLES & RESET --- */
        :root {
            --primary-accent: #00f3ff;
            --secondary-accent: #00ff41;
            --dark-bg: #050505;
            --card-bg: #0a0f14;
            --border: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.1), transparent 50%),
                linear-gradient(rgba(255,255,255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* --- TOP SYSTEM BAR --- */
        .sys-bar {
            background: #000;
            color: var(--primary-accent);
            padding: 8px;
            font-size: 0.7rem;
            text-align: center;
            border-bottom: 1px solid #111;
            position: sticky;
            top: 0;
            z-index: 100;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 2px 10px rgba(0, 243, 255, 0.1);
        }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* --- HEADER --- */
        header {
            text-align: center;
            padding: 40px 15px 20px 15px;
        }
        h1 {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        h1 span { color: var(--primary-accent); }
        .sub { color: #8b949e; font-size: 0.85rem; max-width: 440px; margin: 0 auto; line-height: 1.5; }

        /* --- FUNCTIONAL SEARCH BAR --- */
        .search-container {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 15px;
            position: relative;
        }
        .search-input {
            width: 100%;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 14px 20px 14px 45px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .search-icon {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            pointer-events: none;
        }

        /* --- APP GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 80px;
        }

        /* --- CARD DESIGN --- */
        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .app-card:hover {
            border-color: var(--primary-accent);
            box-shadow: 0 8px 20px rgba(0, 243, 255, 0.15);
            transform: translateY(-4px);
        }
        
        /* Image Area */
        .thumb-area {
            height: 120px;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #111;
            border-bottom: 1px solid #1f2937;
        }
        .mod-tag {
            position: absolute;
            bottom: 0; right: 0;
            background: var(--primary-accent);
            color: #000;
            font-size: 0.65rem;
            padding: 4px 10px;
            font-weight: 800;
            border-top-left-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* Info Area */
        .info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Segoe UI', sans-serif;
        }
        .meta { font-size: 0.7rem; color: #8b949e; display: flex; justify-content: space-between; margin-bottom: 15px; }
        .meta span { color: #fbbf24; font-weight: bold; }

        /* Button & Active States */
        .get-btn {
            background: transparent;
            color: var(--primary-accent);
            border: 1px solid var(--primary-accent);
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .get-btn:hover, .get-btn:active {
            background: var(--primary-accent);
            color: #000;
        }
        .get-btn.loading {
            background: #111827;
            color: #fff;
            border-color: #374151;
            cursor: not-allowed;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #4b5563;
            padding: 40px 20px;
            border-top: 1px solid #111;
            line-height: 1.6;
            background: #000;
        }
    </style>
</head>

        // ==========================================
        // SYSTEM LOGIC - DYNAMIC IMAGE ENGINE
        // ==========================================

        const gridContainer = document.getElementById('appsGrid');

        // Render the games from the database
        function loadGames() {
            gridContainer.innerHTML = '';
            nexisDatabase.forEach(game => {
                
                // DYNAMIC IMAGE GENERATOR: Automatically fetches a genuine game thumbnail based on the title!
                let searchQuery = encodeURIComponent(game.title + " game poster");
                let dynamicThumbnail = `https://tse2.mm.bing.net/th?q=${searchQuery}&w=400&h=200&c=7`;

                const card = `
                <div class="app-card">
                    <div class="thumb-area" style="background-image: url('${dynamicThumbnail}');">
                        <div class="mod-tag">${game.tag}</div>
                    </div>
                    <div class="info">
                        <h3>${game.title}</h3>
                        <div class="meta">${game.size} <span>★ ${game.rating}</span></div>
                        <button class="get-btn" onclick="startInjection(this)">Download Mod/Files</button>
                    </div>
                </div>
                `;
                gridContainer.innerHTML += card;
            });
        }

        // Live Search Filter
        function filterGames() {
            let input = document.getElementById('gameSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Button Animation & Redirect to CPA Link
        function startInjection(button) {
            if(button.classList.contains('loading')) return;
            
            button.classList.add('loading');
            let originalText = button.innerText;
            
            let percent = 0;
            let interval = setInterval(() => {
                percent += 25;
                button.innerText = `PREPARING ${percent}%`;
                
                if(percent >= 100) {
                    clearInterval(interval);
                    button.innerText = "REDIRECTING...";
                    
                    setTimeout(() => {
                        window.location.href = "https://mobilerewards.link/unlock/DwXHau69";
                        
                        setTimeout(() => {
                            button.classList.remove('loading');
                            button.innerText = originalText;
                        }, 2000);
                    }, 800);
                }
            }, 300);
        }

        // Load games when page opens
        window.onload = loadGames;
    </script>
